[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ocrust"
version = "0.2.1"
description = "Fast document OCR for Python with a Rust core: images, TIFF and PDF, no system dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ocr", "pdf", "document", "text-recognition", "rust", "onnx"]
authors = [{ name = "ocrust contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = [
  # Supplies libonnxruntime; the extension dlopens it from the wheel, so no
  # system packages are involved.
  "onnxruntime>=1.20",
]

[project.optional-dependencies]
# PP-OCR model files as a wheel, so a fresh install needs no downloads.
models = ["ocrust-models>=0.1"]
gpu = ["onnxruntime-gpu>=1.20"]

[project.scripts]
ocrust = "ocrust.cli:main"

[project.urls]
Homepage = "https://github.com/mauricekleindienst/ocrust"
Source = "https://github.com/mauricekleindienst/ocrust"
Documentation = "https://github.com/mauricekleindienst/ocrust/tree/main/wiki"
Changelog = "https://github.com/mauricekleindienst/ocrust/blob/main/CHANGELOG.md"
Issues = "https://github.com/mauricekleindienst/ocrust/issues"

[tool.maturin]
manifest-path = "crates/ocrust-py/Cargo.toml"
module-name = "ocrust._ocrust"
python-source = "python"
features = []
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import helpers from conftest by name.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["python", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "ARG", "TID"]
ignore = [
  # The public API deliberately takes many keyword arguments.
  "ARG002",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed local imports and long fixture literals. ARG001 covers
# fixtures requested only for their side effect (the `engine` fixture skips the
# test when no models are installed).
"tests/*" = ["E501", "TID252", "ARG001"]
