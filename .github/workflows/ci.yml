name: ci

on:
  push:
    branches: [main]
    # The publish job below is gated on a release tag, so the workflow has to
    # run for one: a tag push matches no branch filter.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release this commit under this tag, e.g. v0.1.0 (empty: just build and test)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The unit tests need neither models nor ONNX Runtime.
      - run: cargo test -p ocrust-core --lib
      # The accelerator features are compiled by whoever needs them, so nothing
      # else here would notice if one stopped building.
      - name: check the accelerator features
        # One platform is enough to catch an API that moved under us; the
        # providers themselves are only linked at run time.
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p ocrust-core --all-features

  python-lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check python tests scripts examples
      - run: ruff format --check python tests scripts examples

  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          # GitHub retired the Intel macOS runners, so this wheel is
          # cross-compiled on Apple Silicon and cannot be run here.
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: |
          pip install "maturin>=1.7,<2.0"
          maturin build --release --target ${{ matrix.target }} -o dist
      - name: Build the model wheel
        run: python scripts/build_models_wheel.py --models-dir models/ppocrv6 -o dist
      - name: Install and test
        if: matrix.test
        run: |
          pip install --find-links dist "ocrust[models]" pytest numpy pillow
          python -c "import ocrust; print(ocrust.__version__); print(ocrust.runtime_info())"
          ocrust languages
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          # Only the platform wheel: the model wheel is built here for the
          # install test, but it is the same file on every runner, and five
          # artifacts carrying one name corrupt each other when merged.
          path: dist/ocrust-*.whl

  models-wheel:
    name: model wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pure data, identical everywhere, so it is built once and shared.
      - run: python scripts/build_models_wheel.py --models-dir models/ppocrv6 -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: models-wheel
          path: dist/ocrust_models-*.whl

  publish:
    name: publish to PyPI
    # A pushed tag is the normal path; the dispatch input is the one that works
    # from a phone, where creating a tag is the awkward part.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [rust, python-lint, wheels, models-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Tag this commit
        if: inputs.tag != ''
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `refs/tags/${context.payload.inputs.tag}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: tag,
                sha: context.sha,
              });
              core.info(`created ${tag} at ${context.sha}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              // A tag left behind by a release that failed before publishing
              // anything should follow the commit that gets released instead of
              // pointing at the attempt.
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: tag.replace('refs/', ''),
                sha: context.sha,
                force: true,
              });
              core.info(`moved ${tag} to ${context.sha}`);
            }
      # Trusted publishing mints a token for one project at a time, so the two
      # distributions are kept apart from the start.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: upload/engine
      - uses: actions/download-artifact@v4
        with:
          name: models-wheel
          path: upload/models
      - run: ls -l upload/engine upload/models
      # Models first, deliberately: `ocrust[models]` depends on them, so if the
      # second upload fails the world still makes sense. The other way round it
      # would leave an engine on PyPI asking for a package that is not there.
      - name: Publish ocrust-models
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/models
      - name: Publish ocrust
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/engine
