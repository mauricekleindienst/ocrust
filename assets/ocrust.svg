<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern for Background -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#252528" stroke-width="1" opacity="0.5"/>
    </pattern>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5C00" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF5C00" stop-opacity="1"/>
      <stop offset="80%" stop-color="#FF5C00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF5C00" stop-opacity="0"/>
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#121214" rx="16" />

  <!-- Subtle Tech Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- ========================================== -->
  <!-- ICON GRAPHIC (Left Side)                   -->
  <!-- ========================================== -->
  <g transform="translate(10, 0)">

    <!-- Hexagon Background Fill -->
    <polygon points="62.5,35 137.5,35 175,100 137.5,165 62.5,165 25,100" fill="#1C1C1F" opacity="0.9"/>

    <!-- Document Background Fill -->
    <polygon points="70,100 70,55 115,55 130,70 130,145 70,145" fill="#121214"/>

    <!-- Top Half (Unprocessed Document) -->
    <!-- Hexagon Top Stroke -->
    <polyline points="25,100 62.5,35 137.5,35 175,100" fill="none" stroke="#E2E2E8" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Document Top Outline -->
    <polyline points="70,100 70,55 115,55 130,70 130,100" fill="none" stroke="#E2E2E8" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Document Fold -->
    <polyline points="115,55 115,70 130,70" fill="none" stroke="#E2E2E8" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Document Text Lines -->
    <line x1="82" y1="72" x2="105" y2="72" stroke="#E2E2E8" stroke-width="5" stroke-linecap="round"/>
    <line x1="82" y1="86" x2="118" y2="86" stroke="#E2E2E8" stroke-width="5" stroke-linecap="round"/>

    <!-- Bottom Half (Processed Rust Data) -->
    <!-- Hexagon Bottom Stroke -->
    <polyline points="25,100 62.5,165 137.5,165 175,100" fill="none" stroke="#FF5C00" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Document Bottom Outline -->
    <polyline points="70,100 70,145 130,145 130,100" fill="none" stroke="#FF5C00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Code Symbols (Representing Data/Rust) -->
    <polyline points="85,116 77,123.5 85,131" fill="none" stroke="#FF5C00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="115,116 123,123.5 115,131" fill="none" stroke="#FF5C00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="105" y1="114" x2="95" y2="133" stroke="#FF5C00" stroke-width="4" stroke-linecap="round"/>

    <!-- Laser Scanner Beam -->
    <!-- Soft Glow -->
    <line x1="5" y1="100" x2="195" y2="100" stroke="url(#laserGrad)" stroke-width="12" filter="url(#glow)" opacity="0.7"/>
    <!-- Core Beam -->
    <line x1="5" y1="100" x2="195" y2="100" stroke="url(#laserGrad)" stroke-width="3"/>
    <!-- Hot Core Center Highlight -->
    <line x1="50" y1="100" x2="150" y2="100" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

    <!-- Laser Intersection Nodes -->
    <circle cx="25" cy="100" r="5" fill="#121214" stroke="#FF5C00" stroke-width="3"/>
    <circle cx="175" cy="100" r="5" fill="#121214" stroke="#FF5C00" stroke-width="3"/>

  </g>

  <!-- ========================================== -->
  <!-- TYPOGRAPHY (Right Side)                    -->
  <!-- ========================================== -->
  <g transform="translate(225, 0)">

    <!-- Main Library Name -->
    <text x="0" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">
      <tspan fill="#E2E2E8">ocr</tspan><tspan fill="#FF5C00">ust</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="5" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#888890" letter-spacing="3.5">
      BLAZING FAST RUST OCR
    </text>

  </g>
</svg>
