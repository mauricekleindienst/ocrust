[package]
name = "ocrust-core"
description = "Fast, self-contained document OCR engine (PP-OCR family) in pure Rust"
keywords = ["ocr", "onnx", "pdf", "document", "text-recognition"]
categories = ["computer-vision", "science"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
hayro = { workspace = true, optional = true }
image.workspace = true
imageproc.workspace = true
log.workspace = true
lopdf = { workspace = true, optional = true }
ndarray.workspace = true
ort.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tiff.workspace = true
ureq = { workspace = true, optional = true }

[features]
default = ["pdf", "download"]
# Rasterize and read PDFs with the pure-Rust `hayro` renderer.
pdf = ["dep:hayro", "dep:lopdf"]
# Fetch model files over HTTPS into the local model cache.
download = ["dep:ureq", "dep:sha2"]
# ONNX Runtime execution providers. Each needs the matching runtime build.
# `cuda`, `coreml` and `directml` can also be asked for by name (`device="cuda"`);
# the rest are registered by `device="auto"` when the runtime offers them.
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
openvino = ["ort/openvino"]
rocm = ["ort/rocm"]
webgpu = ["ort/webgpu"]

[dev-dependencies]
env_logger = "0.11"
hayro.workspace = true
imageproc.workspace = true
