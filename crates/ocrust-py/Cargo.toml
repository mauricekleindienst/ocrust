[package]
name = "ocrust-py"
description = "Python bindings for ocrust"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "_ocrust"
crate-type = ["cdylib"]

[dependencies]
ocrust-core = { workspace = true, features = ["pdf", "download"] }
image.workspace = true
log.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
serde_json.workspace = true

[features]
default = []
cuda = ["ocrust-core/cuda"]
coreml = ["ocrust-core/coreml"]
directml = ["ocrust-core/directml"]
